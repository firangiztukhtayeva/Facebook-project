{% extends 'base.html' %}

{% block title %}
Posts
{% endblock title %}

{% block body %}
<div class="container">
    <h1>Posts</h1>
    <div class="row">
        {% for post in posts %}
        <div class="card" style="width: 18rem;">
            <img class="w-100" src="{{post.image.url}}" class="card-img-top" alt="...">
            <div class="card-body">
                <h5 class="card-title">{{ post.title }}</h5>
                <p class="card-text">{{ post.text }}</p>
            </div>
        </div>
        {% endfor %}
    </div>
</div>
{% endblock body %}
