{% extends "base.html" %}
{% block title %} {{post.title}}{% endblock title%}

{% block content %}

{% if post.author %}

{% endif %}

<hr>

<p><a href="{% url 'post_view' %}">Orqaga</a></p>
{% endblock content %}
